services:
  - type: web
    name: AlienXFileV2
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app flask_app init-db && gunicorn flask_app:app
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: DATABASE_URL
        sync: false
      - key: BLOB_READ_WRITE_TOKEN
        sync: false
      - key: ALIENX_MCP_ENABLED
        value: "0"
      - key: MCP_API_KEY
        sync: false
      - key: ALIENX_PUBLIC_BASE_URL
        value: https://alienxfilev2.onrender.com
      - key: SECRET_KEY
        generateValue: true
      - key: ALIENX_OAUTH_ENABLED
        value: "1"
      - key: MCP_OAUTH_ENABLED
        value: "1"
      - key: OWNER_USERNAME
        value: owner
      - key: OWNER_PASSWORD_HASH
        sync: false
      - key: OAUTH_ISSUER
        value: https://alienxfilev2.onrender.com
      - key: OAUTH_AUDIENCE
        value: https://alienxfilev2.onrender.com/mcp
      - key: OAUTH_COOKIE_SECURE
        value: "1"
