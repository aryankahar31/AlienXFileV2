{% extends "_oauth_base.html" %}
{% block title %}Owner sign in{% endblock %}
{% block content %}
<h1>Owner sign in</h1>
<p class="oauth-sub">Sign in to authorize an MCP client for {{ owner_name }}.</p>
{% if error %}<div class="oauth-error" role="alert">{{ error }}</div>{% endif %}
<form method="post" action="{{ url_for('oauth.login') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="next" value="{{ next_url }}">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" value="{{ username|default('') }}"
           autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>
    <button class="oauth-btn" type="submit">Sign in</button>
</form>
<p class="oauth-footer"><a href="{{ url_for('index') }}">Back to AlienXFile</a></p>
{% endblock %}
